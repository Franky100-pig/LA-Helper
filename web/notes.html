<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线代难点小讲义 · LA Helper</title>
<!-- 复用主页那套字典与讲义数据（语言偏好也共用 localStorage["la-lang"]） -->
<script src="i18n.js"></script>
<script src="notes.js"></script>
<script>
  // 尽早确定主题与语言，避免首帧闪一下（与主页同一套 localStorage key）
  (function () {
    try {
      var t = localStorage.getItem("la-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* 隐私模式：走默认深色 */ }
    try {
      var l = window.LA_I18N.get();
      document.documentElement.setAttribute("data-lang", l);
      document.documentElement.setAttribute("lang", l === "zh" ? "zh-CN" : "en");
    } catch (e) { /* 拿不到就保持默认中文 */ }
  })();
</script>
<style>
  :root {           /* 默认（深色） */
    --bg: #0b0f14; --panel: #151c25; --panel2: #1e2732;
    --accent: #4ea1ff; --accent2: #ffb454; --text: #e6edf3; --muted: #8b98a5;
    --border: #2b3644; --ok: #3fb950; --bad: #ff6b6b;
    --inset: #0e1620; --inset-focus: #101b26;
    --header-grad: linear-gradient(90deg, #121b26, #151c25);
    --on-accent: #08121f;
  }
  :root[data-theme="light"] {   /* 浅色：纯白底 */
    --bg: #ffffff; --panel: #ffffff; --panel2: #f6f8fa;
    --accent: #2f74b5; --accent2: #a8621c; --text: #1f2328; --muted: #5f6b76;
    --border: #d9dee3; --ok: #1a7f37; --bad: #cf222e;
    --inset: #f6f8fa; --inset-focus: #eef2f6;
    --header-grad: linear-gradient(90deg, #ffffff, #f6f8fa);
    --on-accent: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.5; }

  header { padding: 18px 24px; border-bottom: 1px solid var(--border);
    background: var(--header-grad); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .head-left { min-width: 0; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .ghost { background: var(--panel2); color: var(--text); font-weight: 500;
    border: 1px solid var(--border); padding: 6px 12px; font-size: 13px; border-radius: 8px;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* 「更多工具」下拉：纯 details/summary，无需 JS */
  .tools { position: relative; }
  .tools > summary { list-style: none; }
  .tools > summary::-webkit-details-marker { display: none; }
  .tools > summary::after { content: " ▾"; }
  .tools[open] > summary { border-color: var(--accent); color: var(--accent); }
  .tools-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60;
    min-width: 200px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .tools-menu a { display: block; padding: 8px 10px; border-radius: 7px;
    color: var(--text); text-decoration: none; font-size: 13px; }
  .tools-menu a:hover { background: var(--panel2); color: var(--accent); }

  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid;
    grid-template-columns: 260px minmax(0, 1fr); gap: 20px; align-items: start; }
  .side { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; position: sticky; top: 24px; }
  .side h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .note-list { display: flex; flex-direction: column; gap: 4px; }
  .note-item { display: block; width: 100%; text-align: left; background: none; border: 0;
    color: var(--text); font: inherit; font-size: 14px; padding: 9px 10px; border-radius: 8px;
    cursor: pointer; }
  .note-item:hover { background: var(--panel2); }
  .note-item.on { background: var(--panel2); color: var(--accent); font-weight: 500; }
  .note-item .tag { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 2px; }

  .article { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
  .article h2 { margin: 0 0 6px; font-size: 19px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { font-size: 12px; color: var(--accent2); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px; font-weight: 400; }
  .lead { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .notes-body { line-height: 1.75; font-size: 14px; }
  .notes-body h4 { color: var(--accent); margin: 18px 0 6px; font-size: 14px; }
  .notes-body p { margin: 8px 0; }
  .notes-body ul { margin: 8px 0 8px 1.15em; padding: 0; }
  .notes-body li { margin: 4px 0; }
  .note-formula { background: var(--inset); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin: 10px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; overflow-x: auto; white-space: pre-wrap; }
  .note-tip { background: var(--inset); border-left: 3px solid var(--accent2); border-radius: 6px;
    padding: 10px 12px; margin: 12px 0 4px; font-size: 13px; color: var(--text); }
  a { color: var(--accent); }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; padding: 14px; }
    .side { position: static; padding: 10px; }
    .note-list { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    .note-item { flex: 0 0 auto; white-space: nowrap; border: 1px solid var(--border); padding: 6px 10px; }
    .note-item .tag { display: none; }
    .article { padding: 16px; }
  }
  @media (max-width: 600px) {
    header { padding: 12px 14px; flex-wrap: wrap; }
    header h1 { font-size: 17px; }
    header p { font-size: 12px; }
    .head-right { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <div class="head-left">
    <h1 data-i18n="notes.label">线代难点小讲义</h1>
    <p data-i18n="notes.pageTagline">把最容易卡住的概念讲清楚；点左侧标题切换，链接可直接分享。</p>
  </div>
  <div class="head-right">
    <a class="ghost" href="index.html" data-i18n="notes.back"
       data-i18n-attrs="title:notes.back" title="← 返回计算器">← 返回计算器</a>
    <details class="tools">
      <summary class="ghost" data-i18n="tools.label" data-i18n-attrs="title:tools.label" title="更多工具">更多工具</summary>
      <nav class="tools-menu">
        <a href="ai-help.html" data-i18n="tools.ai"
           data-i18n-attrs="title:tools.aiTip" title="用 AI 解答线代问题（需自备 GLM 免费 Key）">AI 答疑</a>
        <a href="https://github.com/Franky100-pig/LA-hw" target="_blank" rel="noopener noreferrer"
           data-i18n="tools.practice"
           data-i18n-attrs="title:tools.practiceTip" title="带完整解答的线代作业题（新窗口打开 GitHub）">练习题（LA-hw）</a>
      </nav>
    </details>
    <button id="langToggle" class="ghost" type="button"
            data-i18n-attrs="title:app.langTip" title="切换中文 / English">EN</button>
    <!-- 主题按钮文案由 notes-page.js 决定（显示「点了会切到」的模式），只让 title 跟语言走 -->
    <button id="themeToggle" class="ghost" type="button"
            data-i18n-attrs="title:theme.tip" title="切换深色 / 浅色模式">浅色</button>
  </div>
</header>

<main>
  <aside class="side">
    <h3 data-i18n="notes.listTitle">全部讲义</h3>
    <nav id="noteList" class="note-list"></nav>
  </aside>
  <article id="noteView" class="article"></article>
</main>

<script src="notes-page.js"></script>
</body>
</html>
