<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Help · LA Helper</title>
<!-- 复用主页那套字典（语言偏好也共用 localStorage["la-lang"]） -->
<script src="i18n.js"></script>
<script>
  // 尽早确定主题与语言，避免首帧闪一下（与主页同一套 localStorage key）
  (function () {
    try {
      var t = localStorage.getItem("la-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* 隐私模式：走默认深色 */ }
    try {
      var l = window.LA_I18N.get();
      document.documentElement.setAttribute("data-lang", l);
      document.documentElement.setAttribute("lang", l === "zh" ? "zh-CN" : "en");
    } catch (e) { /* 拿不到就保持默认中文 */ }
  })();
</script>
<style>
  :root {           /* 默认（深色） */
    --bg: #0b0f14; --panel: #151c25; --panel2: #1e2732;
    --accent: #4ea1ff; --accent2: #ffb454; --text: #e6edf3; --muted: #8b98a5;
    --border: #2b3644; --ok: #3fb950; --bad: #ff6b6b;
    --inset: #0e1620; --inset-focus: #101b26;
    --header-grad: linear-gradient(90deg, #121b26, #151c25);
    --on-accent: #08121f;
  }
  :root[data-theme="light"] {   /* 浅色：纯白底 */
    --bg: #ffffff; --panel: #ffffff; --panel2: #f6f8fa;
    --accent: #2f74b5; --accent2: #a8621c; --text: #1f2328; --muted: #5f6b76;
    --border: #d9dee3; --ok: #1a7f37; --bad: #cf222e;
    --inset: #f6f8fa; --inset-focus: #eef2f6;
    --header-grad: linear-gradient(90deg, #ffffff, #f6f8fa);
    --on-accent: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.5; }

  header { padding: 18px 24px; border-bottom: 1px solid var(--border);
    background: var(--header-grad); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .head-left { min-width: 0; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .head-right { display: flex; align-items: center; gap: 8px; }
  /* 次要按钮 / 链接：长成 .ghost 的样子 */
  .ghost { background: var(--panel2); color: var(--text); font-weight: 500;
    border: 1px solid var(--border); padding: 6px 12px; font-size: 13px; border-radius: 8px;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }

  main { max-width: 720px; margin: 0 auto; padding: 24px; }
  .ai-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .hint { color: var(--muted); font-size: 13px; }
  .ai-key-box, .ai-ask-box { display: flex; flex-direction: column; gap: 12px; }
  .ai-key-row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1 1 auto; }
  #aiHelpKeyIn, #aiHelpQ { width: 100%; background: var(--inset); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: inherit; resize: vertical; }
  #aiHelpKeyIn:focus, #aiHelpQ:focus { outline: none; border-color: var(--accent); background: var(--inset-focus); }
  .ai-ask-foot { display: flex; align-items: center; gap: 8px; }
  .ai-answer { white-space: pre-wrap; word-break: break-word; background: var(--inset);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-height: 20px;
    font-size: 14px; line-height: 1.6; }
  .ai-answer:empty { display: none; }
  /* KaTeX 渲染的数学：独立公式居中、可横向滚动；行内公式不换行打断 */
  .ai-math-block { display: block; margin: 10px 0; text-align: center; overflow-x: auto; }
  .ai-answer .katex { text-align: initial; }
  button.primary { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent);
    border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.primary:hover { filter: brightness(1.07); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  a { color: var(--accent); }

  @media (max-width: 600px) {
    header { padding: 12px 14px; }
    header h1 { font-size: 17px; }
    header p { font-size: 12px; }
    main { padding: 14px; }
  }
</style>
  <!-- 数学公式渲染：KaTeX。优先 jsDelivr，加载失败时回落到国内 npmmirror 镜像；
       若两个 CDN 都不可用，ai-help.js 会优雅降级为“原始文本 + $…$”显示，不会报错白屏。
       两个源都带 integrity(SRI)：本页把 GLM Key 存在 localStorage，若 CDN 被投毒
       注入脚本就能读走它，SRI 可确保只有字节完全匹配的 KaTeX 才被执行。
       （jsDelivr 与 npmmirror 的 dist 产物已验证字节一致，故回落源共用同一哈希。） -->
  <link rel="stylesheet" id="katexCss"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
        integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
        crossorigin="anonymous" referrerpolicy="no-referrer"
        onerror="this.onerror=null;this.href='https://registry.npmmirror.com/katex/0.16.11/files/dist/katex.min.css'">
  <script defer
          src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
          integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
          crossorigin="anonymous" referrerpolicy="no-referrer"
          onerror="this.onerror=null;var s=document.createElement('script');s.src='https://registry.npmmirror.com/katex/0.16.11/files/dist/katex.min.js';s.integrity='sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg';s.crossOrigin='anonymous';document.head.appendChild(s)"></script>
</head>
<body>
<header>
  <div class="head-left">
    <h1 data-i18n="ai.title">AI Help · 线代小助手</h1>
    <p data-i18n="ai.tagline">用 GLM-4-Flash（免费）直连解答线代问题 · Key 只存本机</p>
  </div>
  <div class="head-right">
    <a class="ghost" href="index.html" data-i18n="ai.back"
       data-i18n-attrs="title:ai.back" title="← 返回">← 返回</a>
    <button id="langToggle" class="ghost" type="button"
            data-i18n-attrs="title:app.langTip" title="切换中文 / English">EN</button>
    <!-- 主题按钮文案由 ai-help.js 决定（显示「点了会切到」的模式），只让 title 跟语言走 -->
    <button id="themeToggle" class="ghost" type="button"
            data-i18n-attrs="title:theme.tip" title="切换深色 / 浅色模式">浅色</button>
  </div>
</header>

<main>
  <div class="ai-card">
    <!-- 首次使用：填自己的 GLM Key（仅存本机 localStorage） -->
    <div id="aiHelpKeyBox" class="ai-key-box">
      <p class="hint" data-i18n-html="ai.keyIntro">首次使用请填入你的 <b>GLM API Key</b>（免费，在
        <a href="https://open.bigmodel.cn" target="_blank" rel="noopener">open.bigmodel.cn</a>
        申请，选 <b>GLM-4-Flash</b> 即可无限免费用）。Key 只存在你本机浏览器，不上传任何服务器。</p>
      <div class="ai-key-row">
        <input type="password" id="aiHelpKeyIn" class="grow"
               placeholder="粘贴 GLM API Key（sk-...）"
               data-i18n-attrs="placeholder:ai.keyPh" autocomplete="off">
        <button id="aiHelpSaveKey" class="primary" type="button" data-i18n="ai.saveKey">保存</button>
      </div>
      <p class="hint" id="aiHelpKeyMsg"></p>
    </div>

    <!-- 已配置 Key：提问框 -->
    <div id="aiHelpAskBox" class="ai-ask-box" hidden>
      <div class="ai-ask-row">
        <textarea id="aiHelpQ" class="grow" maxlength="300" rows="4"
          placeholder="用中文问一个线代问题，例如：为什么 det(AB)=det(A)det(B)？"
          data-i18n-attrs="placeholder:ai.askPh"></textarea>
      </div>
      <div class="ai-ask-foot">
        <span class="hint" id="aiHelpCount" data-i18n="ai.count">0 / 300</span>
        <span class="grow"></span>
        <button id="aiHelpChangeKey" class="ghost" type="button" data-i18n="ai.changeKey">更换 Key</button>
        <button id="aiHelpSend" class="primary" type="button" data-i18n="ai.send">提问</button>
      </div>
      <div id="aiHelpAnswer" class="ai-answer"></div>
      <p class="hint" id="aiHelpStatus"></p>
    </div>
  </div>
</main>

<script src="ai-help.js"></script>
</body>
</html>
