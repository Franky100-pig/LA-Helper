<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LA Helper · 线性代数小算</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #151c25; --panel2: #1e2732;
    --accent: #4ea1ff; --accent2: #ffb454; --text: #e6edf3; --muted: #8b98a5;
    --border: #2b3644; --ok: #3fb950; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    display: flex; flex-direction: column;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, #121b26, #151c25); flex: 0 0 auto;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main {
    flex: 1 1 auto; display: flex; flex-direction: column;
    padding: 20px 24px 32px; max-width: 1100px; margin: 0 auto; width: 100%;
    min-height: 0;
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    background: var(--panel); padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--border); margin-bottom: 18px; flex: 0 0 auto;
  }
  label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  select, input[type=number], button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 14px;
  }
  button {
    background: var(--accent); color: #08121f; font-weight: 600; cursor: pointer;
    border: none; padding: 9px 18px;
  }
  button:hover { filter: brightness(1.08); }
  .matrices { display: flex; gap: 22px; flex-wrap: wrap; flex: 0 0 auto; }
  .matrix-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; min-width: 240px; flex: 1 1 auto;
  }
  .matrix-panel h3 { margin: 0 0 10px; font-size: 15px; color: var(--accent); }
  .dims { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; font-size: 13px; color: var(--muted); }
  .dims input { width: 54px; }
  .grid { display: grid; gap: 6px; }
  .cell {
    width: 64px; height: 42px; text-align: center; font-size: 14px;
    background: #0e1620; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px;
  }
  .cell:focus { outline: 2px solid var(--accent); background: #101b26; }
  .result-area {
    flex: 1 1 auto; margin-top: 18px; min-height: 0;
    display: flex; flex-direction: column;
  }
  .result-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; flex: 1 1 auto; overflow-y: auto;
  }
  .empty-state {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; color: var(--muted); text-align: center; gap: 12px;
  }
  .empty-state svg { opacity: .35; }
  .empty-state p { margin: 0; }
  .empty-state .lead { font-size: 18px; color: var(--text); }
  h3 { font-size: 16px; margin: 0 0 10px; }
  h4 { font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px;
    background: rgba(78,161,255,.15); color: var(--accent); margin-left: 6px;
  }
  .matrix-box {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px; background: #0e1620; border-radius: 10px;
    border: 1px solid var(--border); vertical-align: middle;
  }
  .bracket { font-size: 28px; line-height: 1; color: var(--accent); font-family: serif; }
  table.mat { border-collapse: collapse; }
  table.mat td {
    padding: 5px 10px; text-align: center; min-width: 40px;
    font-variant-numeric: tabular-nums;
  }
  .scalar { font-size: 26px; font-weight: 700; color: var(--accent2); }
  .lu-row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; margin-top: 8px; }
  .eig { background: #0e1620; border: 1px solid var(--border); border-radius: 10px;
         padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  ol.steps {
    background: #0e1620; border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px 14px 38px; font-size: 14px; margin: 10px 0 0;
  }
  ol.steps li { margin: 7px 0; font-variant-numeric: tabular-nums; }
  .error { color: var(--bad); background: rgba(255,107,107,.1); padding: 12px 14px;
           border-radius: 10px; border: 1px solid rgba(255,107,107,.3); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .muted-line { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .warn { color: var(--accent2); font-weight: 600; }
  .exact { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .exact summary { cursor: pointer; }
  .exact code { word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>LA Helper · 线性代数小算</h1>
  <p>本地运行 · 精确分数 · 可看计算步骤 · 学线代更顺手</p>
</header>
<main>
  <section class="controls">
    <label>操作
      <select id="op">
        <option value="multiply">矩阵乘法 A×B</option>
        <option value="add">加法 A+B</option>
        <option value="sub">减法 A−B</option>
        <option value="transpose">转置 Aᵀ</option>
        <option value="scalar">标量乘 k·A（k 填在 B 左上角）</option>
        <option value="inverse">方阵求逆 A⁻¹</option>
        <option value="left_inverse">左逆</option>
        <option value="right_inverse">右逆</option>
        <option value="pseudo_inverse">伪逆 A⁺</option>
        <option value="lu">LU 分解</option>
        <option value="solve">增广矩阵求解 Ax=b</option>
        <option value="rref">RREF 行最简形</option>
        <option value="det">行列式 det(A)</option>
        <option value="rank">秩 rank(A)</option>
        <option value="eigen">特征值 / 特征向量</option>
      </select>
    </label>
    <label><input type="checkbox" id="showSteps" checked> 显示步骤</label>
    <label><input type="checkbox" id="showDecimals"> 小数显示</label>
    <button id="compute">计算</button>
    <span class="hint">提示：格子可输入分数如 1/3、小数如 0.5、负数如 -2</span>
  </section>

  <section class="matrices">
    <div class="matrix-panel" id="panelA">
      <h3>矩阵 A</h3>
      <div class="dims">行 <input id="rowsA" type="number" min="1" max="16" value="2">
        列 <input id="colsA" type="number" min="1" max="16" value="2"></div>
      <div class="grid" id="gridA"></div>
    </div>
    <div class="matrix-panel" id="panelB" style="display:none">
      <h3>矩阵 B / b</h3>
      <div class="dims">行 <input id="rowsB" type="number" min="1" max="16" value="2">
        列 <input id="colsB" type="number" min="1" max="16" value="2"></div>
      <div class="grid" id="gridB"></div>
    </div>
  </section>

  <section id="result" class="result-area">
    <div class="result-card">
      <div class="empty-state">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M3 9h18M9 21V9" />
        </svg>
        <p class="lead">选择操作，填入矩阵，点击“计算”</p>
        <p>结果会在这里显示，勾选“显示步骤”可看详细推导</p>
      </div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
