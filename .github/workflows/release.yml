name: Release

# Windows 的 .exe 无法在 macOS 上交叉编译，所以两个平台的安装包都在这里构建。
# 触发方式：
#   1) push tag（形如 v0.2.0）→ 构建并自动创建 GitHub Release，附件为两个安装包
#   2) Actions 页面手动 Run workflow → 只产出构建工件（Artifacts），不发 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            artifact: LA-Helper-Windows-x64
          - os: macos-14
            label: macOS-arm64
            artifact: LA-Helper-macOS-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Windows / macOS 的官方 Python 构建都自带 tkinter，桌面版开箱可打包
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 打包前先跑测试：装出来的包必须是全绿的版本
      - name: 测试
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: PyInstaller 打包
        run: >
          python -m PyInstaller
          --name "LA Helper"
          --windowed
          --noconfirm
          --clean
          --paths .
          --hidden-import core
          --hidden-import core.engine
          --hidden-import core.matrix
          --hidden-import core.ops
          --hidden-import core.inverse
          --hidden-import core.lu
          --hidden-import core.solve
          --hidden-import core.det_rank
          --hidden-import core.eigen
          desktop/app.py

      - name: 打包成 zip（macOS）
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/LA Helper.app" "${{ matrix.artifact }}.zip"
          ls -lh "${{ matrix.artifact }}.zip"

      - name: 打包成 zip（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\LA Helper" -DestinationPath "${{ matrix.artifact }}.zip"
          Get-Item "${{ matrix.artifact }}.zip" | Format-List Name, Length

      - name: 上传构建工件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
          generate_release_notes: true
          body: |
            ### 本次更新（v0.6.1 → v0.7.0）

            **界面与推导彻底双语**
            - 引擎输出的每一步说明、每一条报错、每个讲义标题都跟着界面语言走（中 ⇄ 英）
            - 修掉 8 处「中文界面里混进英文」的步骤文案（LU 换行、求逆说明、伪逆分支）
            - 新增两个检查器并接进 CI：界面不许有硬编码中文；引擎不许漏翻译
              （含反向——中文输出里混进英文散文也算错）

            **步骤结构化 + 单步播放（网页版 / 在线预览版）**
            - 每一步都带机器可读的矩阵快照与当前主元，界面不再去解析步骤文案
            - 播放器：⏮ ◀ ▶/❚❚ ▶| + 步数计数 +「显示全部步骤」；逐步模式下
              主元格描框、被改动的那一行淡色高亮
            - **默认仍然全部展开**——只想通读推导的人什么都不用点
            - 导出 PDF 不受播放状态影响：无论停在第几步，导出的永远是完整推导

            **讲义与练习**
            - 讲义拆成独立页面（左侧目录 + 右侧正文），顶部「更多工具」统辖各页
            - 8 篇难点笔记，并新增「更多练习」入口（LA-hw 习题集，Set 2 已上架）

            **算起来更顺手**
            - 每个运算都有示例，点「载入示例」直接算给你看；另有三个上手场景
            - 算完推荐对应讲义（「想知道为什么？读这篇」）
            - 记住本机进度（三端都有，只存在本机）
            - 结果区「导出 PDF」：只要结果 + 推导的浅色 A4，不依赖任何第三方库
            - 新增运算：余子式矩阵 C / 伴随矩阵 adj(A)（网页版），配两篇新讲义

            **AI 答疑**
            - 内置公共 Key（可自行更换），KaTeX 渲染 LaTeX 公式，提问上限 300 → 500 字
            - 修：回答被截断在半句（`max_tokens` 600 → 2000）

            **稳定性与安全**
            - 在线预览版的引擎加载改为三镜像自动切换 + 限时重试，不再卡在「加载中」
            - 统一 API 请求体校验（64 KB 上限）、KaTeX SRI 完整性校验，
              并修正文档里关于隐私的失实声明
            - 奇异矩阵求逆不再抛英文异常，而是给出讲得清楚的「无逆」

            ### 下载

            | 你的系统 | 下载 | 说明 |
            |---|---|---|
            | macOS（Apple 芯片 / M 系列） | `LA-Helper-macOS-arm64.zip` | 解压后双击 `LA Helper.app`。未做签名，首次打开需**右键 → 打开**，或在「系统设置 → 隐私与安全性」里点「仍要打开」 |
            | Windows 10 / 11（64 位） | `LA-Helper-Windows-x64.zip` | 解压后双击 `LA Helper.exe`。SmartScreen 可能提示，点「更多信息 → 仍要运行」 |

            不想下载安装包？在线预览版（无需安装，浏览器直接跑）：
            https://la-helper.app.workbuddy.host/
