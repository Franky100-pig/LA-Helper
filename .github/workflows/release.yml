name: Release

# Windows 的 .exe 无法在 macOS 上交叉编译，所以两个平台的安装包都在这里构建。
# 触发方式：
#   1) push tag（形如 v0.2.0）→ 构建并自动创建 GitHub Release，附件为两个安装包
#   2) Actions 页面手动 Run workflow → 只产出构建工件（Artifacts），不发 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            artifact: LA-Helper-Windows-x64
          # macos-14 已于 2026-11-02 退役（GitHub 官方公告），改用 macos-15（同为 arm64）
          - os: macos-15
            label: macOS-arm64
            artifact: LA-Helper-macOS-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Windows / macOS 的官方 Python 构建都自带 tkinter，桌面版开箱可打包
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 打包前先跑测试：装出来的包必须是全绿的版本
      - name: 测试
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: PyInstaller 打包
        run: >
          python -m PyInstaller
          --name "LA Helper"
          --windowed
          --noconfirm
          --clean
          --paths .
          --hidden-import core
          --hidden-import core.engine
          --hidden-import core.matrix
          --hidden-import core.ops
          --hidden-import core.inverse
          --hidden-import core.lu
          --hidden-import core.solve
          --hidden-import core.det_rank
          --hidden-import core.eigen
          --hidden-import core.transform
          desktop/app.py

      - name: 打包成 zip（macOS）
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/LA Helper.app" "${{ matrix.artifact }}.zip"
          ls -lh "${{ matrix.artifact }}.zip"

      - name: 打包成 zip（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\LA Helper" -DestinationPath "${{ matrix.artifact }}.zip"
          Get-Item "${{ matrix.artifact }}.zip" | Format-List Name, Length

      - name: 上传构建工件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
          generate_release_notes: true
          body: |
            ### 本次更新（v0.10.2 → v0.11.0）

            这是一个大版本：讲义从 **17 篇扩到 35 篇**，全部公式接入 KaTeX 数学排版，
            AI 答疑支持连续追问，另外新增了一份考前速查的公式合集。

            **讲义（网页版）**
            - **公式真正渲染**：新增 KaTeX，分数、求和、上下标都是数学排版，不再是斜杠纯文本
            - **公式合集（速查）**：10 个模块 23 条公式，每条下面逐符号说明含义，考前扫一遍
            - **新增 18 篇讲义**：复特征值、正交与子空间六篇、线性方程组与高斯消元、
              线性相关与线性无关、代数重数 vs 几何重数、Gram-Schmidt（重写，补正交分解）等
            - 「已读」改为**滑到文末才打勾**，不再一打开就标记
            - 每篇底部「提 Issue」改成「**问 AI 助手**」：带着这篇标题跳到答疑页并预填问题

            **AI 答疑**
            - **支持连续追问**：记住最近 4 轮对话，可以问「那这一步呢」「为什么是复数」
            - 新增「新话题」按钮，一键清空上下文换题
            - 接入**免 Key 兜底线路**：公共 Key 全部失效时仍能回答（浏览器可直连，按 IP 限流）
            - 说明改为**开箱即用**：不用注册、不用填 Key 就能提问；自己的 Key 仍然优先

            **桌面版**
            - 特征值推导从特征方程起头，逐个 λ 展示 RREF → 特征向量 → 代回验证
            - 与网页版同步版本号；引擎无破坏性改动，旧数据不受影响

            ### 下载

            | 你的系统 | 下载 | 说明 |
            |---|---|---|
            | macOS（Apple 芯片 / M 系列） | `LA-Helper-macOS-arm64.zip` | 解压后双击 `LA Helper.app`。未做签名，首次打开需**右键 → 打开**，或在「系统设置 → 隐私与安全性」里点「仍要打开」 |
            | Windows 10 / 11（64 位） | `LA-Helper-Windows-x64.zip` | 解压后双击 `LA Helper.exe`。SmartScreen 可能提示，点「更多信息 → 仍要运行」 |

            不想下载安装包？在线预览版（无需安装，浏览器直接跑）：
            https://la-helper.app.workbuddy.host/
