name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只需读代码跑测试，不需要写任何东西。
# 不显式声明会沿用仓库默认权限（可能比实际需要的宽）。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: 前端脚本检查（Node）：i18n + 讲义 + 计数 + 导出 + 新手引导 + 公共 Key
        run: |
          node tools/check_i18n.js
          node tools/test_notes.js
          node tools/test_counter.js
          node tools/test_export.js
          node tools/test_onboarding.js
          node tools/test_ai_key.js
      - name: 示例矩阵能真的算出来（喂给真正的 core 引擎）
        run: python tools/test_examples.py
      - name: 冒烟测试（启动本地服务并请求一次）
        run: |
          python web/app.py --no-browser --port 8123 &
          sleep 3
          curl -sS -X POST http://127.0.0.1:8123/api/compute \
            -H 'Content-Type: application/json' \
            -d '{"op":"det","A":[["1","2"],["3","4"]]}'
