[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "la-helper"
version = "0.6.0"
description = "本地运行的线性代数学习计算器：精确分数 + 可看步骤"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["sympy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
